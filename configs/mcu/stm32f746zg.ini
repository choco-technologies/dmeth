; STM32F746ZG MCU Ethernet configuration - generic defaults, no board-specific
; GPIO pins (see configs/board/<board>/eth0.ini for a board that wires these
; up). Buffer counts/sizes match dnx-rtos's own STM32F4x7 ETH driver default
; (10 RX + 10 TX descriptors, ~30 KB total - see docs/port-implementation.md).
[dmeth]
driver_name=dmeth
instance=0
rx_buffer_count=10
tx_buffer_count=10
promiscuous=off
phy_address=0
