; STM32F407VG MCU Ethernet configuration - generic defaults, no board-specific
; GPIO pins. The Ethernet MAC/DMA IP block is identical to STM32F7's (see
; include/port/stm32_common_regs.h) - build with -DDMOD_CPU_FAMILY=stm32f4
; to select this family's port.
[dmeth]
driver_name=dmeth
instance=0
rx_buffer_count=10
tx_buffer_count=10
promiscuous=off
phy_address=0
