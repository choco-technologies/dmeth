; NUCLEO-F767ZI - RMII Ethernet (LAN8742A PHY, MDIO address 0)
; Pin mapping confirmed against Zephyr's board support file for this exact
; board (boards/st/nucleo_f767zi/nucleo_f767zi.dts, &mac/&mdio pinctrl-0):
;   REF_CLK=PA1  MDIO=PA2  CRS_DV=PA7  MDC=PC1
;   RXD0=PC4  RXD1=PC5  TX_EN=PG11  TXD0=PG13  TXD1=PB13
; Note TXD1 is PB13 here, NOT PG14 like the 32F746G-DISCOVERY board - real
; board-to-board RMII pin differences exist even within ST's own eval board
; lineup, so don't copy this onto another board without checking its own
; pin mapping. No RX_ER pin is wired on this board (not present in the
; Zephyr pinctrl-0 list).
; All RMII signals use AF11 (Ethernet alternate function).

[eth_ref_clk]
driver_name=dmgpio
driver_order=3
pin=PA1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_mdio]
driver_name=dmgpio
driver_order=3
pin=PA2
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_crs_dv]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_mdc]
driver_name=dmgpio
driver_order=3
pin=PC1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_rxd0]
driver_name=dmgpio
driver_order=3
pin=PC4
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_rxd1]
driver_name=dmgpio
driver_order=3
pin=PC5
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_tx_en]
driver_name=dmgpio
driver_order=3
pin=PG11
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_txd0]
driver_name=dmgpio
driver_order=3
pin=PG13
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_txd1]
driver_name=dmgpio
driver_order=3
pin=PB13
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth0]
driver_name=dmeth
driver_order=4
instance=0
rx_buffer_count=10
tx_buffer_count=10
mac_address=02:00:00:00:00:02
promiscuous=off
phy_address=0
