; NUCLEO-F429ZI - RMII Ethernet (LAN8742A PHY, MDIO address 0)
; Pin mapping confirmed against Zephyr's board support file for this exact
; board (boards/st/nucleo_f429zi/nucleo_f429zi.dts, &mac/&mdio pinctrl-0):
;   REF_CLK=PA1  MDIO=PA2  CRS_DV=PA7  MDC=PC1
;   RXD0=PC4  RXD1=PC5  TX_EN=PG11  TXD0=PG13  TXD1=PB13
; Same MB1137 Nucleo-144 board layout as NUCLEO-F767ZI (identical pin
; mapping, including TXD1=PB13 rather than PG14). No RX_ER pin is wired.
; All RMII signals use AF11 (Ethernet alternate function).

[eth_ref_clk]
driver_name=dmgpio
driver_order=3
pin=PA1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_mdio]
driver_name=dmgpio
driver_order=3
pin=PA2
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_crs_dv]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_mdc]
driver_name=dmgpio
driver_order=3
pin=PC1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_rxd0]
driver_name=dmgpio
driver_order=3
pin=PC4
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_rxd1]
driver_name=dmgpio
driver_order=3
pin=PC5
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_tx_en]
driver_name=dmgpio
driver_order=3
pin=PG11
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_txd0]
driver_name=dmgpio
driver_order=3
pin=PG13
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth_txd1]
driver_name=dmgpio
driver_order=3
pin=PB13
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=none

[eth0]
driver_name=dmeth
driver_order=4
instance=0
rx_buffer_count=10
tx_buffer_count=10
mac_address=02:00:00:00:00:03
promiscuous=off
phy_address=0
