; 32F746G-DISCOVERY - RMII Ethernet (LAN8742A PHY, MDIO address 0)
; Pin mapping confirmed against this exact board's schematic via ChocoOS's
; own board config (chocos/Source/system/config/stm32f746ngh6/oc_pinsmap.h):
;   REF_CLK=PA1  MDIO=PA2  CRS_DV=PA7  MDC=PC1
;   RXD0=PC4  RXD1=PC5  TX_EN=PG11  TXD0=PG13  TXD1=PG14  RXER=PG2
; All RMII signals use AF11 (Ethernet alternate function).

[eth_ref_clk]
driver_name=dmgpio
driver_order=3
pin=PA1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_mdio]
driver_name=dmgpio
driver_order=3
pin=PA2
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_crs_dv]
driver_name=dmgpio
driver_order=3
pin=PA7
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_mdc]
driver_name=dmgpio
driver_order=3
pin=PC1
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_rxd0]
driver_name=dmgpio
driver_order=3
pin=PC4
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_rxd1]
driver_name=dmgpio
driver_order=3
pin=PC5
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_tx_en]
driver_name=dmgpio
driver_order=3
pin=PG11
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_txd0]
driver_name=dmgpio
driver_order=3
pin=PG13
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_txd1]
driver_name=dmgpio
driver_order=3
pin=PG14
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth_rxer]
driver_name=dmgpio
driver_order=3
pin=PG2
mode=alternate
alternate_function=11
speed=maximum
output_circuit=push_pull
pull=up

[eth0]
driver_name=dmeth
driver_order=4
instance=0
rx_buffer_count=10
tx_buffer_count=10
mac_address=02:00:00:00:00:01
promiscuous=off
phy_address=0
