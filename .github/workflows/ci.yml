name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test-core:
    name: Build and Test dmeth (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmeth core module
        run: |
          mkdir -p build
          cd build
          # dmeth links against dmeth_port_if (headers only),
          # not dmeth_port itself, so building only these two targets
          # never touches src/port/*/port.c - safe to build natively here
          # regardless of which CPU family the port defaults to.
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build . --target dmeth test_dmeth

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmeth.dmf
          test -f build/dmf/dmeth_version.txt
          test -f build/dmf/test_dmeth.dmf
          echo "Module files present"

      # test_dmeth calls dmeth_port_* directly against real ETH silicon (MAC
      # loopback) - see the top comment in tests/dmeth_test.c - so it depends
      # on the real, architecture-specific dmeth_port module at load time and
      # cannot run under dmod_loader on this native x86_64 runner (dmeth_port
      # has no x86_64 port, and there is no ETH hardware here regardless).
      # Only compiling it is verified above; actually running it is an
      # on-target step, not part of this job.

  discover-cpu-families:
    name: Discover CPU Families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpu_families: ${{ steps.list-families.outputs.cpu_families }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available CPU families
        id: list-families
        run: |
          # Find all CPU families by looking for directories containing port.c
          CPU_FAMILIES=$(find src/port -mindepth 2 -maxdepth 2 -name "port.c" -type f -printf '%h\n' | \
            xargs -n1 basename | \
            sort | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Found CPU families: $CPU_FAMILIES"
          echo "cpu_families=$CPU_FAMILIES" >> $GITHUB_OUTPUT

  build-dmeth:
    name: Build dmeth for ${{ matrix.cpu_family }}
    needs: discover-cpu-families
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        cpu_family: ${{ fromJson(needs.discover-cpu-families.outputs.cpu_families) }}

    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmeth for ${{ matrix.cpu_family }}
        run: |
          set -e
          CPU_FAMILY="${{ matrix.cpu_family }}"
          mkdir -p build_$CPU_FAMILY
          cd build_$CPU_FAMILY

          cmake .. -DDMOD_CPU_FAMILY="${CPU_FAMILY}"
          cmake --build .

          echo "Build completed for CPU family: ${CPU_FAMILY}"
          ls -lh dmf/

      - name: Verify dmeth_port module files
        run: |
          CPU_FAMILY="${{ matrix.cpu_family }}"
          echo "Checking for dmeth_port module files for ${CPU_FAMILY}..."
          ls -lh build_$CPU_FAMILY/dmf/
          test -f build_$CPU_FAMILY/dmf/dmeth_port.dmf
          test -f build_$CPU_FAMILY/dmf/dmeth_port_version.txt
          echo "Module files present for ${CPU_FAMILY}"
